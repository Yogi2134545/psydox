[theme]
base            = "dark"
primaryColor    = "#ff6600"
backgroundColor = "#1a1a1a"
secondaryBackgroundColor = "#2a2a2a"
textColor       = "#ffffff"
font            = "sans serif"

[server]
maxUploadSize              = 2000
headless                   = true
enableWebsocketCompression = false
maxMessageSize             = 2000
enableCORS                 = false
enableXsrfProtection       = false
